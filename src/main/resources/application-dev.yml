# =====================================================================
# Profile `dev` — chỉ dùng khi phát triển local qua docker-compose.
# KHÔNG bật profile này ở môi trường thật.
# =====================================================================
spring:
  jpa:
    show-sql: true
  flyway:
    # V100__seed_dev_reference.sql chỉ chạy ở profile dev (xem locations bên dưới):
    # thêm thư mục dev vào sau thư mục migration chung.
    locations: classpath:db/migration,classpath:db/dev
    # V100 (seed dev) cố tình đánh số cao để luôn chạy sau cùng — nghĩa là mọi migration
    # schema thật (V2, V3, ...) thêm SAU KHI DB dev đã seed sẽ có version THẤP HƠN version
    # đã áp dụng gần nhất. out-of-order cho phép Flyway vẫn chèn migration "đến muộn" đó
    # thay vì chặn validate. Chỉ bật ở dev — môi trường thật luôn migrate từ DB rỗng nên
    # không bao giờ gặp tình huống này.
    out-of-order: true
  devtools:
    restart:
      enabled: true
      # Bind mount trên Windows/WSL2 không phát sinh inotify event đáng tin,
      # nên devtools phải poll thay vì watch.
      poll-interval: 2s
      quiet-period: 1s

logging:
  level:
    com.lms: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    # Bật dòng dưới khi cần xem giá trị tham số bind vào câu SQL
    # org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: INFO
