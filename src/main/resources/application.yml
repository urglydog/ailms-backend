# =====================================================================
# AI-Powered LMS — Core Web Service
# Mọi secret đọc từ biến môi trường (xem .env.example). Không hardcode.
# =====================================================================
spring:
  application:
    name: ai-powered-lms

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/lms_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:lms_user}
    password: ${SPRING_DATASOURCE_PASSWORD:lms_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    # validate: Hibernate ĐỐI CHIẾU 31 entity với schema do Flyway tạo.
    # Lệch một cột là app fail ngay khi khởi động — đây là cơ chế tự kiểm
    # quan trọng nhất của Giai đoạn 0. TUYỆT ĐỐI không đổi sang update/create.
    hibernate:
      ddl-auto: validate
    open-in-view: false     # tránh giữ session mở suốt request (chống N+1 ngầm)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 30
          time_zone: Asia/Ho_Chi_Minh
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      # Spring Boot 3 dùng spring.data.redis.*, KHÔNG phải spring.redis.*
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5s

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  servlet:
    multipart:
      # BR-CHUNK-01: video MP4 tối đa 2 GB
      max-file-size: 2GB
      max-request-size: 2GB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# ── Google OAuth2 Configuration ────────────────────────────────
google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}

# ── Cấu hình riêng của ứng dụng ─────────────────────────────────
lms:
  jwt:
    secret: ${JWT_SECRET}
    # BR-AUTH-04: access 15 phút, refresh 7 ngày
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:7d}

  # Hạn ngạch nghiệp vụ — cấu hình được để test dễ
  quota:
    dub-student-per-day: ${QUOTA_DUB_STUDENT_PER_DAY:15}          # BR-DUB-06
    dub-instructor-per-day: ${QUOTA_DUB_INSTRUCTOR_PER_DAY:30}    # BR-DUB-06
    material-per-day: ${QUOTA_MATERIAL_PER_DAY:6}                 # BR-MAT-08
    tutor-msg-per-day: ${QUOTA_TUTOR_MSG_PER_DAY:30}              # BR-TUTOR-04
    discovery-guest-per-hour: ${QUOTA_DISCOVERY_GUEST_PER_HOUR:15} # BR-DISCOVERY-01

  # Ngưỡng nghiệp vụ lấy từ business rules
  rules:
    lesson-complete-threshold-percent: 90    # BR-PROGRESS-01
    max-preview-lessons-per-course: 2        # BR-ENROLL-02
    max-documents-per-lesson: 5              # BR-UPLOAD-01
    max-document-size-mb: 50                 # BR-UPLOAD-01
    max-material-sets-per-course: 10         # BR-MAT-07
    max-course-resubmit: 5                   # BR-COURSE-04
    min-reject-reason-length: 20             # BR-COURSE-04
    payment-expire-minutes: 15               # BR-PAY-03
    platform-fee-percent: 30                 # BR-PAY-05
    instructor-earning-percent: 70           # BR-PAY-05
    notification-retention-days: 90          # BR-NOTIFY-01
    instructor-request-cooldown-days: 7      # BR-ROLE-04

  storage:
    b2-bucket-name: ${B2_BUCKET_NAME:}
    b2-key-id: ${B2_KEY_ID:}
    b2-application-key: ${B2_APPLICATION_KEY:}
    b2-endpoint: ${B2_ENDPOINT:}

  internal:
    # Token AI Worker dùng khi gọi callback về đây
    api-token: ${INTERNAL_API_TOKEN:dev-internal-token}

  # Giai đoạn 5 — trước đây khối này bị lồng nhầm dưới `payment:` do lỗi thụt dòng, sau đó lại bị
  # lồng nhầm sang dưới `ai:`. Đã dời về đúng block `lms:`.
  redis-keys:
    dubbing-queue: "lms:dubbing:jobs"
    dubbing-progress: "lms:dubbing:progress"
    dub-lock-prefix: "lock:dub:"        # lock:dub:{lessonId}:{lang} — BR-DUB-05
    login-fail-prefix: "login_fail:"    # BR-AUTH-03
    discovery-rate-prefix: "discovery_rate:" # BR-DISCOVERY-01
  dub-lock-ttl-seconds: ${DUB_LOCK_TTL_SECONDS:1800}   # BR-DUB-05 (30 phút)

ai:
  worker:
    # URL nội bộ Docker — FE KHÔNG gọi trực tiếp; Backend proxy vào đây (BR-DISCOVERY-01)
    base-url: ${INTERNAL_BE_AI_URL:http://ai-api:8000}

payment:
  vnpay:
    tmnCode: ${VNPAY_TMN_CODE:}
    hashSecret: ${VNPAY_HASH_SECRET:}
    url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    returnUrl: http://localhost:3000/payments/vnpay-return
  momo:
    partnerCode: ${MOMO_PARTNER_CODE:}
    accessKey: ${MOMO_ACCESS_KEY:}
    secretKey: ${MOMO_SECRET_KEY:}
  zalopay:
    appId: ${ZALOPAY_APP_ID:}
    key1: ${ZALOPAY_KEY1:}
    key2: ${ZALOPAY_KEY2:}

logging:
  level:
    root: INFO
    com.lms: DEBUG
