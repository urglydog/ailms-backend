# =====================================================================
# AI-Powered LMS — Môi trường phát triển
#
# File này nằm trong repo `be` (service lõi) nhưng điều phối cả 3 service.
# ĐIỀU KIỆN: 3 repo phải được clone NGANG HÀNG:
#     project/
#       ├─ be/          ← chạy lệnh docker compose từ đây
#       ├─ fe/
#       └─ ai-worker/
#
# Chạy:  cd project/be && docker compose up -d
# Hướng dẫn đầy đủ: ./RUNNING.md
#
# Lưu ý: KHÔNG có key `version:` — Compose V2 đã bỏ, để lại sẽ cảnh báo.
# =====================================================================

# Hiệu năng đợt 8: mẫu xoay vòng log dùng chung (tối đa 3 file x 10 MB mỗi container).
x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Cơ sở dữ liệu ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: lms_mysql
    # Trần RAM (26/11/2026) — chỉ là giới hạn trên, không chiếm sẵn; xem docs/perf/GIOI_HAN_RAM.md
    mem_limit: 768m
    restart: unless-stopped
    # Hiệu năng đợt 8: xoay vòng log (Docker mặc định để log tăng mãi) — dùng chung mẫu x-logging ở đầu file.
    logging: *default_logging
    # utf8mb4 là BẮT BUỘC: transcript tiếng Việt/Nhật/Hàn sẽ lỗi với charset mặc định
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=caching_sha2_password
      --slow_query_log=1
      --long_query_time=1
      --slow_query_log_file=/var/lib/mysql/slow.log
    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lms_db}
      # App dùng user riêng, không dùng root (nguyên tắc least-privilege)
      MYSQL_USER: ${MYSQL_USER:-lms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lms_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    # Trần RAM (26/11/2026) — chỉ là giới hạn trên, không chiếm sẵn; xem docs/perf/GIOI_HAN_RAM.md
    mem_limit: 320m
    restart: unless-stopped
    # Hiệu năng đợt 8: xoay vòng log (Docker mặc định để log tăng mãi) — dùng chung mẫu x-logging ở đầu file.
    logging: *default_logging
    # maxmemory 192mb (< trần container 320m, chừa chỗ cho ghi lại file AOF). volatile-lru: khi đầy chỉ loại khoá CÓ hạn dùng
    # (bộ đếm rate limit, cache); hàng đợi Celery và khoá không hạn không bị loại (26/11/2026).
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy volatile-lru --requirepass ${REDIS_PASSWORD:?Thieu_Mat_Khau_Redis_trong_env}
    volumes:
      - redis_data:/data
    # Healthcheck để backend/worker chờ đúng thời điểm Redis sẵn sàng
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Thieu_Mat_Khau_Redis_trong_env}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Công cụ hỗ trợ dev ────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: lms_adminer
    # Trần RAM (26/11/2026) — chỉ là giới hạn trên, không chiếm sẵn; xem docs/perf/GIOI_HAN_RAM.md
    mem_limit: 64m
    restart: unless-stopped
    # Hiệu năng đợt 8: xoay vòng log (Docker mặc định để log tăng mãi) — dùng chung mẫu x-logging ở đầu file.
    logging: *default_logging
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8083}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy

  # Mail server giả để test OTP đăng ký / quên mật khẩu (BR-AUTH-02)
  # Không cần SMTP thật khi dev. UI xem mail: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: lms_mailpit
    # Trần RAM (26/11/2026) — chỉ là giới hạn trên, không chiếm sẵn; xem docs/perf/GIOI_HAN_RAM.md
    mem_limit: 96m
    restart: unless-stopped
    # Hiệu năng đợt 8: xoay vòng log (Docker mặc định để log tăng mãi) — dùng chung mẫu x-logging ở đầu file.
    logging: *default_logging
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # ── Service 1: Backend lõi (Spring Boot 3 + Maven) ────────────
  backend:
    # Image production (25/11/2026): jar build sẵn, không hot-reload, không mount thư mục code.
    # Build + phát hành: xem docs/perf/QUY_TRINH_PHAT_HANH_BACKEND.md. Chế độ phát triển cũ (mvn
    # spring-boot:run, mount code) vẫn còn trong Dockerfile.dev nếu cần quay lại.
    image: lms-backend:prod
    pull_policy: never
    container_name: lms_backend
    # Trần RAM (26/11/2026) — chỉ là giới hạn trên, không chiếm sẵn; xem docs/perf/GIOI_HAN_RAM.md
    mem_limit: 1536m
    restart: unless-stopped
    # Hiệu năng đợt 8: Docker mặc định chỉ chờ 10s rồi kill; backend tắt an toàn tối đa 30s
    # (server.shutdown: graceful + SHUTDOWN_TIMEOUT), nên cho Docker chờ 35s.
    stop_grace_period: 35s
    # Giới hạn dung lượng log (25/11/2026): log backend ở chế độ dev đã lên tới 302 MB và tăng mãi
    # vì Docker mặc định không xoay vòng. Tối đa 3 file x 20 MB.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      # BUG THUC TE (30/08/2026): container KHONG dat TZ nen chay UTC, trong khi JDBC URL ben
      # duoi khai "serverTimezone=Asia/Ho_Chi_Minh" — MySQL Connector/J tin loi khai bao nay,
      # tu quy doi moi LocalDateTime.now() (Hibernate @CreatedDate...) LECH +7 GIO truoc khi ghi
      # xuong DB (vd: ChatSession.createdAt hien "future" so voi gio that cua may chu). Dat TZ
      # dung thuc te de loi khai bao o tren tro thanh dung, sua tan goc thay vi sua tung cho.
      TZ: Asia/Ho_Chi_Minh
      LMS_CORS_ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # Đặt cứng `prod` (không đọc từ .env vì .env đang là `dev`): image này là bản chạy thật.
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:--Xms128m -Xmx896m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC}
      # Nap du lieu demo (khoa hoc YouTube + hoc vien/ghi danh/thanh toan gia lap) — chi them, khong xoa.
      # Bat bang APP_DEMO_SEED_ENABLED=true; mat khau chung dat trong .env (khong commit).
      APP_DEMO_SEED_ENABLED: ${APP_DEMO_SEED_ENABLED:-false}
      APP_DEMO_SEED_PASSWORD: ${APP_DEMO_SEED_PASSWORD:-}
      # Seed du lieu mau dev (4 class Dev*Seeder) — mac dinh tat.
      DEV_SEED_ENABLED: ${DEV_SEED_ENABLED:-false}
      # Datasource
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-lms_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-lms_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-lms_pass}
      # QUAN TRỌNG: Spring Boot 3 dùng SPRING_DATA_REDIS_*, KHÔNG phải SPRING_REDIS_*
      # (property đã đổi tên từ Boot 3.0 — dùng tên cũ là Redis không kết nối được)
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Timeout lệnh Redis 1 giây (27/11/2026). Mặc định application.yml là 5s: khi Redis chết, mỗi yêu cầu cần ≥ 3 thao tác Redis
      # (giới hạn tần suất, đọc/ghi cache) nên chờ cộng dồn ≥ 15s → API treo (diễn tập docs/perf/drills/DRILL_20261127.md).
      SPRING_DATA_REDIS_TIMEOUT: ${REDIS_COMMAND_TIMEOUT:-1s}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Thieu_Mat_Khau_Redis_trong_env}
      # Mail — mặc định Mailpit (local dev), điền SPRING_MAIL_* trong be/.env để chuyển
      # sang Gmail SMTP thật (production) mà không cần đổi file này (27/09/2026).
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_SMTP_STARTTLS: ${SPRING_MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@lms.local}
      # Domain FE dùng cho link trong email/reset-password và link xác minh chứng chỉ. PHẢI liệt kê
      # ở đây — service này không có env_file nên biến chỉ có trong .env sẽ KHÔNG vào container.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      CERTIFICATE_VERIFY_BASE_URL: ${CERTIFICATE_VERIFY_BASE_URL:-http://localhost:3000/verify}
      # JWT — thời hạn theo BR-AUTH-04
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET chua duoc dat trong .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      # Giai đoạn 5 — khóa Redis chống trùng job lồng tiếng (BR-DUB-05)
      DUB_LOCK_TTL_SECONDS: ${DUB_LOCK_TTL_SECONDS:-1800}
      # Hạn ngạch nghiệp vụ (BR-DUB-06, BR-MAT-08, BR-TUTOR-04, BR-DISCOVERY-01)
      QUOTA_DUB_STUDENT_PER_DAY: ${QUOTA_DUB_STUDENT_PER_DAY:-15}
      QUOTA_DUB_INSTRUCTOR_PER_DAY: ${QUOTA_DUB_INSTRUCTOR_PER_DAY:-30}
      QUOTA_MATERIAL_PER_DAY: ${QUOTA_MATERIAL_PER_DAY:-6}
      QUOTA_TUTOR_MSG_PER_DAY: ${QUOTA_TUTOR_MSG_PER_DAY:-30}
      QUOTA_DISCOVERY_GUEST_PER_HOUR: ${QUOTA_DISCOVERY_GUEST_PER_HOUR:-15}
      # Cloud storage
      B2_BUCKET_NAME: ${B2_BUCKET_NAME:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
      B2_ENDPOINT: ${B2_ENDPOINT:-}
      # YouTube Data API v3 — YoutubeMetadataService (05/09/2026, thay yt-dlp bị chặn IP VPS)
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # Cổng thanh toán (Sandbox)
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      # Kênh CHI HỘ của PayOS (kênh riêng, có Client ID/API Key/Checksum Key riêng). Để trống = dùng lại 3 khóa thanh toán ở trên.
      PAYOS_PAYOUT_CLIENT_ID: ${PAYOS_PAYOUT_CLIENT_ID:-}
      PAYOS_PAYOUT_API_KEY: ${PAYOS_PAYOUT_API_KEY:-}
      PAYOS_PAYOUT_CHECKSUM_KEY: ${PAYOS_PAYOUT_CHECKSUM_KEY:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-}
      ZALOPAY_APP_ID: ${ZALOPAY_APP_ID:-}
      ZALOPAY_KEY1: ${ZALOPAY_KEY1:-}
      ZALOPAY_KEY2: ${ZALOPAY_KEY2:-}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      # Google OAuth
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      # Chỉ dùng cho luồng mobile (BE tự đổi authorization code lấy id_token) — web vẫn
      # verify id_token có sẵn từ GSI, không cần secret.
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # KHÔNG map GOOGLE_OAUTH_MOBILE_REDIRECT_URI ở đây — nếu set (kể cả rỗng) thì Spring coi
      # biến môi trường "đã có giá trị" và bỏ qua default trong application.yml, dù giá trị đó
      # là chuỗi rỗng. Chỉ set biến này ở be/.env khi thật sự cần đổi domain khác default.
      # Token nội bộ để AI Worker gọi callback về đây
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      # Giai đoạn 11 — LiveKit Cloud (F11.1)
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LMS_PAYOUT_ENCRYPTION_KEY: ${LMS_PAYOUT_ENCRYPTION_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ── Service 2a: AI API (FastAPI, HTTP đồng bộ) ────────────────
  # Phục vụ UC30 Socratic Tutor và UC49 Course Discovery — hai UC này
  # trả lời trực tiếp cho người dùng nên KHÔNG đi qua Celery.
  ai-api:
    build:
      context: ../ai-worker
      dockerfile: Dockerfile
    container_name: lms_ai_api
    # Trần RAM (26/11/2026) — chỉ là giới hạn trên, không chiếm sẵn; xem docs/perf/GIOI_HAN_RAM.md
    mem_limit: 384m
    restart: unless-stopped
    # Chạy kiểu production (26/11/2026): bỏ --reload (tự nạp lại khi file đổi). Code AI vẫn mount từ ../ai-worker,
    # nên sau khi sửa code phải khởi động lại: `docker compose up -d --no-build --force-recreate ai-api`.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Giới hạn dung lượng log để không phình đầy ổ đĩa (NCKH N4, 13/11/2026): tối đa 3 file x 10 MB / container.
    logging: &ai_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${AI_API_PORT:-8000}:8000"
    # Biến riêng của ai-worker (ASR/LLM/TTS/tham số pipeline/B2/Supabase) đọc từ
    # project/ai-worker/.env — tách khỏi be/.env (Giai đoạn 5) để dễ quản lý theo service.
    env_file:
      - ../ai-worker/.env
    environment: &ai_env
      REDIS_URL: redis://:${REDIS_PASSWORD:?Thieu_Mat_Khau_Redis_trong_env}@redis:6379/0
      # AI Worker KHÔNG kết nối MySQL trực tiếp (xem architecture.md) —
      # mọi thay đổi dữ liệu phải gọi callback về backend.
      INTERNAL_BE_URL: http://backend:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      # CHỈ 3 biến thực sự dùng chung với `be` mới liệt kê ở đây. Mọi biến riêng của
      # ai-worker (ASR/LLM/TTS/tham số pipeline/B2/Supabase) đã đọc qua `env_file:` ở
      # trên rồi — liệt kê lại bằng ${VAR:-...} là BUG: giá trị đó nội suy từ `.env`
      # GỐC (`project/be/.env`), không phải `project/ai-worker/.env`, nên sẽ ĐÈ giá
      # trị thật bằng chuỗi rỗng/giá trị mặc định (đã từng vá lỗi này 1 lần, bị tái
      # lập lại — xem GEMINI_API_KEY từng bị rỗng dù `.env` của ai-worker có key thật).
    volumes:
      - ../ai-worker:/app
      - ai_tmp_storage:/tmp/lms-processing   # file trung gian, xoá ≤24h (BR-STORAGE-01)
    depends_on:
      redis:
        condition: service_healthy

  # ── Service 2b: Celery worker (tác vụ nặng bất đồng bộ) ───────
  # UC19 pipeline lồng tiếng, UC25 sinh học liệu
  ai-worker:
    build:
      context: ../ai-worker
      dockerfile: Dockerfile
    container_name: lms_ai_worker
    # Trần RAM (26/11/2026) — chỉ là giới hạn trên, không chiếm sẵn; xem docs/perf/GIOI_HAN_RAM.md
    mem_limit: 1280m
    oom_score_adj: 500   # khi máy cạn RAM, hệ điều hành dừng container này trước MySQL/backend/Redis
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info --concurrency=8
    logging: *ai_logging
    env_file:
      - ../ai-worker/.env
    environment: *ai_env
    volumes:
      - ../ai-worker:/app
      - ai_tmp_storage:/tmp/lms-processing
    depends_on:
      redis:
        condition: service_healthy

  # ── Service 2c: Celery beat (tác vụ định kỳ) ──────────────────
  # BR-STORAGE-01 dọn file trung gian 24h · BR-NOTIFY-01 dọn thông báo 90 ngày
  # + nhắc lịch ôn Flashcards · BR-DUB-08 báo cáo audio ít dùng hàng tuần
  ai-beat:
    build:
      context: ../ai-worker
      dockerfile: Dockerfile
    container_name: lms_ai_beat
    # Trần RAM (26/11/2026) — chỉ là giới hạn trên, không chiếm sẵn; xem docs/perf/GIOI_HAN_RAM.md
    mem_limit: 192m
    restart: unless-stopped
    command: celery -A app.celery_app beat --loglevel=info
    logging: *ai_logging
    env_file:
      - ../ai-worker/.env
    environment: *ai_env
    volumes:
      - ../ai-worker:/app
    depends_on:
      redis:
        condition: service_healthy

  # ── Service 3: Frontend (Next.js) ─────────────────────────────
  frontend:
    # Chỉ bật khi gọi đúng profile: `docker compose --profile frontend up -d frontend` (26/11/2026).
    # Không có dòng này thì `docker compose up -d` trơn sẽ tự build image Next.js (~2 GB đĩa, nhiều RAM) trên server.
    profiles: ["frontend"]
    build:
      context: ../fe
      dockerfile: Dockerfile.dev
    container_name: lms_frontend_dev
    # Tắt auto-restart (30/10/2026) — FE thật chạy qua Vercel, container này chỉ để debug local
    # trên server khi cần, không nên tự bật lại và chiếm RAM (từng gây OOM 23/10). Muốn chạy lại
    # thủ công: docker compose up -d frontend
    restart: "no"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    # Biến riêng của frontend (NEXT_PUBLIC_*) đọc từ project/fe/.env — tách khỏi
    # be/.env (Giai đoạn 5) để dễ quản lý theo service.
    env_file:
      - ../fe/.env
    environment:
      # Browser gọi qua localhost (người dùng thật gõ URL này)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      # Server Component fetch TỪ TRONG container — phải dùng tên service,
      # localhost trong container là chính container frontend, không phải backend.
      # Không phải thứ người dùng chỉnh nên giữ hardcode, không đưa vào .env.
      INTERNAL_API_URL: http://backend:8080
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:8080}
      # Google OAuth2 — NEXT_PUBLIC_* phải được truyền vào đây để Next.js bake vào bundle
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_OAUTH_CLIENT_ID:-}}
      WATCHPACK_POLLING: "true"   # hot-reload qua bind mount trên Windows/WSL2
    volumes:
      - ../fe:/app
      - frontend_node_modules:/app/node_modules   # giữ node_modules của container
      - frontend_next_cache:/app/.next
    depends_on:
      backend:
        condition: service_started

  # ── Service 4: Reverse Proxy (Caddy) ──────────────────────────
  # Tự động cấp chứng chỉ HTTPS (SSL) cho nip.io để giải quyết lỗi 
  # Vercel 500 và lỗi Mixed Content trên trình duyệt.
  caddy:
    image: caddy:2-alpine
    container_name: lms_caddy
    # Trần RAM (26/11/2026) — chỉ là giới hạn trên, không chiếm sẵn; xem docs/perf/GIOI_HAN_RAM.md
    mem_limit: 128m
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8443:443"
    # Cấu hình nằm ở ./Caddyfile (26/11/2026): cùng hành vi lệnh `caddy reverse-proxy` cũ + header bảo mật.
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # Kiểm tra Caddy đang nghe cổng 80/443 (admin API của Caddy không mở nên không dùng được).
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 443 && nc -z -w 3 127.0.0.1 80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Giới hạn log (Caddy không có xoay vòng mặc định): tối đa 3 file x 10 MB.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data:
  redis_data:
  backend_maven_cache:
  frontend_node_modules:
  frontend_next_cache:
  ai_tmp_storage:
  caddy_data:
  caddy_config:

networks:
  default:
    name: lms_network
